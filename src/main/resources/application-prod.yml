# RDS·S3 엔드포인트는 Terraform이 띄울 때마다 바뀌고, 도메인은 공개 리포지토리에
# 남길 이유가 없다. 이 파일에 박지 않고 기동 시 Parameter Store에서 읽는다.
#
#   /test-wes/prod/spring.datasource.url
#   /test-wes/prod/spring.datasource.username
#   /test-wes/prod/spring.datasource.password  (SecureString)
#   /test-wes/prod/app.s3.bucket
#   /test-wes/prod/springdoc.server-url
#   /test-wes/prod/cors.allowed-origins
spring:
  config:
    import: aws-parameterstore:/test-wes/prod/

  jpa:
    # 스키마는 Flyway가 소유한다. Hibernate는 엔티티와 어긋나는지 확인만 한다.
    hibernate:
      ddl-auto: validate
    show-sql: false

# 이 프로필에서만 잡는다. 로컬은 프론트(localhost:5173)와 앱(localhost:8080)이
# 포트만 다른 같은 사이트라 기본값 Lax로도 쿠키가 실린다.
server:
  servlet:
    session:
      cookie:
        # 배포 API는 test-api.easyselect.kr, 프론트는 localhost — 서로 다른 사이트다.
        # Lax면 로그인 응답의 쿠키는 저장되지만 이후 fetch에 실리지 않아 전부 401이 된다.
        same-site: none
        # None은 Secure 없이는 브라우저가 쿠키 자체를 거부한다. ALB가 HTTPS를 종단하고
        # 앱은 평문 8080으로 받으므로, 요청 스킴으로 판단하게 두면 안 되고 못박아야 한다.
        secure: true
