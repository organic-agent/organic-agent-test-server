name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_BASENAME: test-wes
  # EC2가 x86_64(t3)라서 amd64로 빌드한다. 러너도 amd64라 QEMU 없이 네이티브로 돈다.
  # Dockerfile이 이미지 안에서 `./gradlew bootJar`를 돌리므로 이 정합성이 특히 중요하다.
  # Graviton(arm64)으로 옮기려면 인스턴스 타입·PLATFORM을 함께 바꾸고, 빌드가 QEMU로
  # 기어가지 않도록 Dockerfile을 미리 빌드된 jar를 COPY하는 형태로 먼저 바꿔야 한다.
  PLATFORM: linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image_name: ${{ steps.meta.outputs.image_name }}
      owner_lowercase: ${{ steps.meta.outputs.owner_lowercase }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 배포 전 마지막 게이트. 여기서 깨지면 이미지를 밀지 않는다.
      - name: Build & test
        run: ./gradlew build

      - name: Resolve image metadata
        id: meta
        run: |
          # GHCR 경로는 소문자만 받는다. 조직명에 대문자가 있어도 안전하도록 변환한다.
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "owner_lowercase=${OWNER_LOWERCASE}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${OWNER_LOWERCASE}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # 등록할 시크릿이 없다. GITHUB_TOKEN은 실행마다 자동으로 발급된다.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          # latest만 쓰면 어떤 커밋이 떠 있는지 알 수 없고 롤백도 안 된다.
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SSH 대신 SSM을 쓴다: 보안그룹에 22번 인바운드가 없고, SSH 키·호스트 IP를 시크릿으로
  # 들고 있을 필요가 없다. 인스턴스는 Name 태그로 찾고 자격증명은 OIDC로 그때그때 받는다.
  # 필요한 시크릿은 AWS_DEPLOY_ROLE_ARN 하나 — test-infra의
  # `terraform output -raw github_deploy_role_arn` 값이다.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # OIDC로 AWS 롤을 assume 하기 위한 토큰 발급 권한

    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_NAME_TAG: test-wes-app
      OWNER_LOWERCASE: ${{ needs.build-and-push.outputs.owner_lowercase }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}

    steps:
      # 서버로 보낼 것은 compose 파일 하나뿐이라 저장소 전체를 받지 않는다.
      - name: 설정 파일만 체크아웃
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: AWS 자격증명 설정 (OIDC — 장기 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 대상 인스턴스 조회
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "실행 중인 ${INSTANCE_NAME_TAG} 인스턴스가 없습니다 (인프라 destroy 상태인지 확인)" >&2
            exit 1
          fi
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: 컨테이너 교체 및 헬스체크 (SSM Run Command)
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.id }}"

          # scp가 없으므로 compose 파일은 base64로 스크립트에 실어 보낸다.
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          # 원격(EC2)에서 root로 실행될 스크립트. \$ 는 원격에서 평가되는 변수다.
          # GITHUB_TOKEN은 잡 종료와 함께 만료되는 단기 토큰이라 SSM 명령 이력에 남아도
          # 재사용이 불가능하다. 패키지를 public으로 바꾸면 login 단계는 지워도 된다.
          cat > deploy_script.sh <<SCRIPT
          set -e

          # compose 파일의 \${...}를 채울 값. 서버에 .env를 남기지 않는다.
          export OWNER_LOWERCASE="${OWNER_LOWERCASE}"
          export IMAGE_TAG="${IMAGE_TAG}"
          WORK_DIR=/opt/test-wes

          mkdir -p "\$WORK_DIR"
          echo "${COMPOSE_B64}" | base64 -d > "\$WORK_DIR/docker-compose.yml"

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          cd "\$WORK_DIR"
          docker compose pull
          docker compose up -d --force-recreate

          # 새 태그를 pull하면 이전 이미지는 태그를 잃고 dangling(<none>)이 된다.
          # 작은 EC2는 이미지로 디스크가 차므로 그것들을 지운다.
          docker image prune -f

          # 기동에 시간이 걸린다(Parameter Store 조회 + JPA ddl-auto=update).
          # actuator가 의존성에 없으므로 springdoc이 노출하는 /v3/api-docs로 확인한다.
          # 이 엔드포인트가 200이면 DataSource·JPA까지 다 뜬 상태다.
          for i in \$(seq 1 30); do
            HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' \
              --connect-timeout 2 "http://localhost:8080/v3/api-docs" || true)
            [ "\$HTTP_CODE" = "200" ] && { echo "기동 완료 (\${i}번째 시도)"; exit 0; }
            sleep 5
          done

          echo "150초 안에 기동하지 못했습니다" >&2
          docker compose logs --tail 50 >&2
          exit 1
          SCRIPT

          # 스크립트를 통째로 JSON 파라미터에 담는다 (따옴표/개행 이스케이프는 jq가 처리).
          jq -n --rawfile script deploy_script.sh '{commands: [$script]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "test-wes deploy ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)

          # 원격 스크립트가 pull + 헬스체크(최대 150초)까지 하므로 넉넉히 10분 폴링.
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          # 성공이든 실패든 원격 로그를 러너 콘솔에 그대로 남긴다.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json \
            | jq -r '"--- status: \(.status)\n--- stdout ---\n\(.stdout)\n--- stderr ---\n\(.stderr)"'

          [ "$STATUS" = "Success" ]
